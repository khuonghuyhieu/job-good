name: good-job

x-server-environment: &server-environment
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-good_job}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-good_job}?schema=public
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-replace-with-at-least-32-characters}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-good-job-media}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-good-job-local}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
  OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
  MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-10485760}
  MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-209715200}
  MEDIA_MAX_VIDEO_DURATION_SECONDS: ${MEDIA_MAX_VIDEO_DURATION_SECONDS:-180}
  WEBSOCKET_PATH: ${WEBSOCKET_PATH:-/socket.io}
  ORGANIZATION_TIMEZONE: ${ORGANIZATION_TIMEZONE:-Asia/Ho_Chi_Minh}
  SEED_BUSINESS_MONTH: ${SEED_BUSINESS_MONTH:-2026-07}
  API_PORT: 3000
  WORKER_HEALTH_PORT: 3001

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-good_job}
      POSTGRES_USER: ${POSTGRES_USER:-good_job}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-good_job} -d ${POSTGRES_DB:-good_job}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-good-job-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-good-job-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:-good-job-media}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
    restart: 'no'

  migrate:
    image: good-job-database:local
    build:
      context: ..
      dockerfile: packages/database/Dockerfile
    environment:
      <<: *server-environment
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        './packages/database/node_modules/.bin/prisma',
        'migrate',
        'deploy',
        '--schema=packages/database/prisma/schema.prisma',
      ]
    restart: 'no'

  seed:
    image: good-job-database:local
    build:
      context: ..
      dockerfile: packages/database/Dockerfile
    environment:
      <<: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      [
        './packages/database/node_modules/.bin/tsx',
        'packages/database/prisma/seed.ts',
      ]
    restart: 'no'

  api:
    image: good-job-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *server-environment
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: good-job-worker:local
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *server-environment
    ports:
      - '127.0.0.1:${WORKER_HEALTH_PORT:-3001}:3001'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health/ready']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: good-job-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
