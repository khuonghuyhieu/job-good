name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: good_job
          POSTGRES_USER: good_job
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U good_job -d good_job"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://good_job:local-development-only@localhost:5432/good_job?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:8080
      VITE_API_URL: http://localhost:3000
      VITE_WEBSOCKET_PATH: /socket.io
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: good-job-media
      OBJECT_STORAGE_ACCESS_KEY: good-job-local
      OBJECT_STORAGE_SECRET_KEY: local-development-only
      OBJECT_STORAGE_FORCE_PATH_STYLE: true
      ORGANIZATION_TIMEZONE: Asia/Ho_Chi_Minh
      SEED_BUSINESS_MONTH: 2026-07

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start MinIO
        run: >-
          docker run --detach --name good-job-ci-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=good-job-local
          --env MINIO_ROOT_PASSWORD=local-development-only
          minio/minio:RELEASE.2025-09-07T16-13-09Z
          server /data
      - name: Wait for and initialize MinIO
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:9000/minio/health/live && break
            if [ "$attempt" = 30 ]; then docker logs good-job-ci-minio; exit 1; fi
            sleep 1
          done
          docker run --rm --network host \
            --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -ec 'mc alias set local http://localhost:9000 good-job-local local-development-only && mc mb --ignore-existing local/good-job-media && mc anonymous set none local/good-job-media'
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate fresh migrations
        run: pnpm db:reset:test
      - run: pnpm db:seed
      - name: Verify repeatable seed
        run: pnpm db:seed
      - run: pnpm test:integration
      - name: Prepare clean E2E database
        run: pnpm db:reset:test && pnpm db:seed
      - run: pnpm build
      - name: Run E2E against built applications
        run: |
          set -a
          source .env.example
          set +a

          node apps/api/dist/main.js > /tmp/good-job-api.log 2>&1 &
          api_process_id=$!
          node apps/worker/dist/main.js > /tmp/good-job-worker.log 2>&1 &
          worker_process_id=$!
          (
            cd apps/web
            exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 8080
          ) > /tmp/good-job-web.log 2>&1 &
          web_process_id=$!

          cleanup() {
            kill "$api_process_id" "$worker_process_id" "$web_process_id" 2>/dev/null || true
          }
          show_logs() {
            echo "API log"
            cat /tmp/good-job-api.log
            echo "Worker log"
            cat /tmp/good-job-worker.log
            echo "Web log"
            cat /tmp/good-job-web.log
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              show_logs
              exit 1
            fi
            sleep 1
          done

          if ! pnpm test:e2e; then
            show_logs
            exit 1
          fi
      - run: docker compose config --quiet
      - name: Build production images
        run: docker compose build api worker web
