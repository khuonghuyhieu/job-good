name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: good_job
          POSTGRES_USER: good_job
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U good_job -d good_job"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://good_job:local-development-only@localhost:5432/good_job?schema=public
      REDIS_URL: redis://localhost:6379
      ORGANIZATION_TIMEZONE: Asia/Ho_Chi_Minh
      SEED_BUSINESS_MONTH: 2026-07

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate fresh migrations
        run: pnpm db:reset:test
      - run: pnpm db:seed
      - name: Verify repeatable seed
        run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: docker compose config --quiet
